<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE FARM — BOARDING PASS SCAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE7D6;
    --card:#FBF8EF;
    --ink:#152238;
    --ink-soft:#6B6355;
    --line:#D8CFB6;
    --operator:#B23A2E;
    --explorer:#1F6F8B;
    --connector:#A6631D;
    --thinker:#5B3A8E;
    --builder:#2E7D5B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(21,34,56,0.06) 1px, transparent 0);
    background-size:20px 20px;
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:26px 14px;
  }
  .stage{ width:100%; max-width:460px; transition:max-width 0.15s ease; }
  .stage.wide{ max-width:980px; }
  .display{ font-family:'Jua', sans-serif; letter-spacing:0.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- ticket shell ---------- */
  .card{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:16px;
    box-shadow:0 3px 0 var(--ink), 0 16px 32px rgba(21,34,56,0.16);
    position:relative;
    overflow:visible;
  }
  .card-topline{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 20px;
    background:var(--ink);
    color:var(--paper);
    border-radius:14px 14px 0 0;
  }
  .card-topline .tag{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; display:flex; align-items:center; gap:6px; }

  .card-inner{ padding:26px 24px 8px; }

  /* route indicator (used in intro + quiz progress) */
  .route{ display:flex; align-items:center; gap:10px; margin:4px 0 4px; }
  .route .stop{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:0.06em; flex-shrink:0; }
  .route .stop.dim{ color:var(--ink-soft); }
  .route-line{ position:relative; flex:1; height:16px; }
  .route-line .dots{
    position:absolute; top:50%; left:0; right:0; height:0;
    border-top:2px dashed var(--line); transform:translateY(-50%);
  }
  .route-line .plane{
    position:absolute; top:50%; transform:translate(-50%,-50%);
    font-size:15px; transition:left 0.3s ease;
  }

  /* ---------- perforation divider ---------- */
  .perf{
    position:relative; height:0; border-top:2px dashed var(--line); margin:22px -2px 0;
  }
  .perf::before, .perf::after{
    content:''; position:absolute; top:-11px; width:22px; height:22px; border-radius:50%;
    background:var(--paper); border:2px solid var(--ink);
  }
  .perf::before{ left:-13px; }
  .perf::after{ right:-13px; }

  /* ---------- entry tabs ---------- */
  .entry-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .entry-tab{
    flex:1; padding:11px; border-radius:9px; border:1.5px solid var(--line);
    background:#fff; font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:700;
    letter-spacing:0.04em; color:var(--ink-soft); cursor:pointer; transition:all 0.14s ease;
  }
  .entry-tab:hover{ border-color:var(--ink); color:var(--ink); }
  .entry-tab.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }

  .field-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); letter-spacing:0.08em; margin:4px 0 7px; }
  .field-input{
    width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-size:15.5px; font-family:'Noto Sans KR',sans-serif; color:var(--ink); background:#fff; margin-bottom:4px;
  }
  .field-input:focus{ outline:none; border-color:var(--ink); }
  .field-error{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--operator); margin:6px 0 0; }

  /* ---------- intro ---------- */
  .lede{ font-size:14.5px; color:var(--ink-soft); line-height:1.7; margin:12px 0 22px; }
  h1.title{ font-size:28px; line-height:1.35; margin:10px 0 0; }
  .type-preview{ display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin:22px 0 6px; }
  .type-chip{ border:1.5px solid var(--line); border-radius:10px; padding:10px 3px 8px; text-align:center; background:#fff; }
  .type-chip .sym{ font-size:17px; display:block; margin-bottom:4px; }
  .type-chip .code{ font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--ink-soft); }

  .stub{ padding:16px 24px 24px; }
  button.primary{
    width:100%; background:var(--ink); color:var(--paper); border:none; border-radius:11px;
    padding:16px; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px;
    letter-spacing:0.06em; cursor:pointer; transition:transform 0.12s ease, opacity 0.12s ease;
  }
  button.primary:hover{ opacity:0.88; transform:translateY(-1px); }
  button.primary:disabled{ opacity:0.55; cursor:default; transform:none; }
  .meta-line{ text-align:center; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:12px; }

  /* ---------- quiz ---------- */
  .scan-top{ display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); margin-bottom:2px; }
  .q-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin:22px 0 8px; }
  .q-text{ font-size:19px; line-height:1.55; font-weight:700; margin-bottom:24px; min-height:78px; }

  .scale-ends{ display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); margin-bottom:8px; }
  .likert{ display:flex; gap:8px; margin-bottom:16px; }
  .likert-btn{
    flex:1; height:50px; display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--line); border-radius:9px; font-family:'IBM Plex Mono',monospace;
    font-size:15px; font-weight:600; color:var(--ink-soft); background:#fff; cursor:pointer;
    transition:all 0.14s ease;
  }
  .likert-btn:hover{ border-color:var(--ink); color:var(--ink); }
  .likert-btn.selected{ background:var(--ink); border-color:var(--ink); color:var(--paper); }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; padding:0 24px 22px; }
  .back-link{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); background:none; border:none; cursor:pointer; padding:8px 2px; }
  .back-link:disabled{ opacity:0; pointer-events:none; }
  .skip-hint{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); }

  /* ---------- result: BOARDING PASS ---------- */
  .pass-fields{ display:grid; grid-template-columns:1fr 1fr; gap:14px 10px; margin:4px 0 6px; }
  .pf{ }
  .pf-label{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--ink-soft); letter-spacing:0.1em; margin-bottom:3px; }
  .pf-value{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:700; }

  .stamp-wrap{ display:flex; justify-content:center; margin:14px 0 6px; }
  .type-name-block{ text-align:center; margin:6px 0 4px; }
  h2.type-name{ font-size:33px; margin:2px 0 6px; }
  .type-sub{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.14em; color:var(--ink-soft); }
  .type-tagline{ font-size:14px; color:var(--ink-soft); line-height:1.6; text-align:center; margin:8px 0 0; }
  .hybrid-note{
    display:block; width:fit-content; margin:12px auto 0; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    border:1px dashed var(--line); border-radius:100px; padding:5px 11px;
  }
  .type-desc{ font-size:14px; line-height:1.75; margin:16px 0 4px; }

  .radar-wrap{ display:flex; justify-content:center; padding:10px 0 4px; }

  .clearance h3, .traits h3{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; color:var(--ink-soft); margin:16px 0 10px; }
  .axis-row{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
  .axis-name{ width:74px; flex-shrink:0; font-size:11.5px; font-weight:700; }
  .axis-track{ flex:1; height:8px; background:var(--paper); border:1px solid var(--line); border-radius:100px; overflow:hidden; }
  .axis-fill{ height:100%; border-radius:100px; }
  .axis-score{ width:30px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); flex-shrink:0; }

  .traits{ margin:4px 0 4px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .traits ul{ margin:0; padding-left:16px; font-size:13px; line-height:1.7; }

  .cta-row{ display:flex; gap:9px; padding:20px 24px 24px; }
  .cta-row button{
    flex:1; border-radius:11px; padding:13px; font-family:'IBM Plex Mono',monospace;
    font-weight:700; font-size:12.5px; letter-spacing:0.04em; cursor:pointer; border:1.5px solid var(--ink);
  }
  .cta-row .restart{ background:#fff; color:var(--ink); }
  .cta-row .share{ background:var(--ink); color:var(--paper); }

  /* ---------- admin dashboard ---------- */
  .admin-shell{ background:var(--card); border:2px solid var(--ink); border-radius:14px; box-shadow:0 3px 0 var(--ink); padding:22px 22px 26px; }
  .admin-header{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:18px; padding-bottom:16px; border-bottom:2px solid var(--ink); }
  .admin-title{ font-size:21px; }
  .admin-sub{ font-size:11px; color:var(--ink-soft); letter-spacing:0.1em; margin-top:5px; }
  .admin-actions{ display:flex; gap:8px; }
  .admin-btn{
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; padding:10px 14px;
    border-radius:9px; border:1.5px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer;
  }
  .admin-btn.ghost{ background:#fff; color:var(--ink); }
  .admin-btn:disabled{ opacity:0.5; cursor:default; }
  .admin-empty{ padding:44px 0; text-align:center; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .admin-table-wrap{ overflow-x:auto; }
  .admin-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .admin-table th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.05em;
    color:var(--ink-soft); padding:9px 12px; border-bottom:2px solid var(--ink); white-space:nowrap;
  }
  .admin-table td{ padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; font-size:13px; }
  .admin-table tbody tr:hover{ background:var(--paper); }

  @media (max-width:420px){
    .card-inner{ padding:22px 18px 8px; }
    .stub, .nav-row, .cta-row{ padding-left:18px; padding-right:18px; }
    h1.title{ font-size:23px; }
    .q-text{ font-size:17px; min-height:88px; }
    h2.type-name{ font-size:27px; }
    .pass-fields{ grid-template-columns:1fr 1fr; }
    .admin-shell{ padding:18px 16px 20px; }
  }
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<script>
/* ---------------------------------------------------------
   1. DATA
--------------------------------------------------------- */
const PERSONAS = {
  operator: {

    desc:'새로운 툴이 나오면 일단 써보는 사람. 모르는 내용은 그냥 넘기지 않고 바로 찾아보며, AI를 포함한 새로운 방식을 실무에 빠르게 흡수합니다. 자료 제작·리서치·프로세스 개선에서 강점을 보입니다.',

const AXIS_ORDER = ['operator','explorer','connector','thinker','builder'];
const AXIS_LABEL = { operator:'실행력', explorer:'대응력', connector:'커넥팅', thinker:'문제해결', builder:'학습력' };

const QUESTIONS = [
  { id:1,  axis:'operator', r:false, text:'나는 지시가 없어도 먼저 움직이는 편이다.' },
  { id:6,  axis:'explorer', r:true,  text:'나는 낯선 장소에 가면 적응하는 데 시간이 좀 걸리는 편이다.' },

  { id:17, axis:'thinker', r:true,  text:'나는 문제가 생기면 우선 누구의 책임인지부터 확인하고 싶다.' },
  { id:22, axis:'builder', r:true,   text:'나는 같은 업무를 정해진 매뉴얼대로 진행하는 것이 편하다.' },

  { id:3,  axis:'operator', r:false, text:'나는 갑자기 일이 생겨도 바로 대응하는 편이다.' },
  { id:8,  axis:'explorer', r:true,  text:'나는 예상 못한 변수가 생기면 그날 하루 컨디션에 영향을 받는 편이다.' },
  { id:13, axis:'connector', r:true, text:'나는 낯선 모임에 다녀오면 기운이 빠지고 혼자만의 시간이 필요하다.' },
  { id:18, axis:'thinker', r:false, text:'나는 정답이 없는 상황에서도 스스로 기준을 세워 결정한다.' },
  { id:23, axis:'builder', r:false,  text:'나는 모르는 내용이 나오면 바로 찾아보고 확인하는 편이다.' },

  { id:4,  axis:'operator', r:true,  text:'나는 여러 일이 한꺼번에 몰리면 하나씩 순서대로 처리해야 마음이 놓인다.' },
  { id:9,  axis:'explorer', r:false, text:'나는 새로운 환경에 놓이는 것에 큰 부담을 느끼지 않는다.' },

  { id:19, axis:'thinker', r:true,  text:'나는 익숙한 방식을 그대로 따르는 것이 새로운 시도보다 마음 편하다.' },

/* ---------------------------------------------------------
   2. STATE
--------------------------------------------------------- */
let screen = 'entry';        // 'entry' | 'quiz' | 'result' | 'admin'
let entryTab = 'guest';      // 'guest' | 'admin'
let guestName = '';
let entryError = '';

let adminCode = '';
let adminError = '';
let adminLoading = false;
let adminResults = null;
let adminResultsError = '';

let qIndex = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let render_result_data = null;

const stage = document.getElementById('stage');

function render(){
  stage.classList.toggle('wide', screen==='admin');
  if(screen==='entry') renderEntry();
  else if(screen==='quiz') renderQuiz();
  else if(screen==='admin') renderAdminDashboard();
  else renderResult();
}

function routeIndicator(pct){
  return `
    <div class="route">
      <span class="stop">YOU</span>
      <div class="route-line">
        <div class="dots"></div>
        <span class="plane" style="left:${pct}%;">✈️</span>
      </div>
      <span class="stop dim">FARM</span>
    </div>
  `;
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){
  return String(str ?? '').replace(/"/g,'&quot;');
}

/* ---------------------------------------------------------
   3. ENTRY (게스트 / 관리자 탭)
--------------------------------------------------------- */
function renderEntry(){
  stage.innerHTML = `
    <div class="card">
      <div class="card-topline">
        <span class="tag">✈ THE FARM AIR</span>
        <span class="tag">${entryTab==='guest' ? 'TALENT SCAN' : 'STAFF LOGIN'}</span>
      </div>
      <div class="card-inner">
        <div class="entry-tabs">
          <button class="entry-tab ${entryTab==='guest'?'active':''}" onclick="switchEntryTab('guest')">게스트</button>
          <button class="entry-tab ${entryTab==='admin'?'active':''}" onclick="switchEntryTab('admin')">관리자</button>
        </div>
        ${entryTab==='guest' ? guestPanelHTML() : adminPanelHTML()}
      </div>
      <div class="perf"></div>
      <div class="stub">
        ${entryTab==='guest' ? `
          <button class="primary" onclick="handleGuestStart()">탑승 수속 시작 →</button>
          <div class="meta-line">약 3분 소요 · 25문항 · 결과 즉시 발급</div>
        ` : `
          <button class="primary" onclick="handleAdminLogin()" ${adminLoading?'disabled':''}>${adminLoading?'확인 중...':'로그인'}</button>
          <div class="meta-line">관리자 전용 · 코드 입력 필요</div>
        `}
      </div>
    </div>

}

function switchEntryTab(tab){
  entryTab = tab;
  entryError = '';
  adminError = '';
  render();
}

function guestPanelHTML(){
  return `
    <div class="mono" style="font-size:11px;color:var(--ink-soft);letter-spacing:0.14em;">BOARDING PASS · FIELD TYPE</div>
    <h1 class="title display">당신의 출장 유형,<br>탑승권으로 알려드려요</h1>
    <p class="lede">
      25개 문항에 답하면 THE FARM 현장에서 당신이 가장 강점을 발휘할 필드 유형을
      탑승권 형태로 발급해드립니다. 정답은 없어요 — 있는 그대로 답해주세요.
    </p>
    ${routeIndicator(0)}
    <div class="type-preview">
      ${AXIS_ORDER.map(k=>{
        const p = PERSONAS[k];
        return `<div class="type-chip"><span class="sym">${p.sym}</span><span class="code">${p.code}</span></div>`;
      }).join('')}
    </div>
    <div class="field-label mono" style="margin-top:22px;">이름</div>
    <input id="guestNameField" class="field-input" type="text" placeholder="이름을 입력해주세요" maxlength="30"
      oninput="guestName=this.value" onkeydown="if(event.key==='Enter')handleGuestStart()" />
    ${entryError ? `<div class="field-error">${entryError}</div>` : ''}
  `;
}

function adminPanelHTML(){
  return `
    <div class="mono" style="font-size:11px;color:var(--ink-soft);letter-spacing:0.14em;">STAFF ONLY · ADMIN ACCESS</div>
    <h1 class="title display" style="font-size:24px;">관리자 코드를<br>입력해주세요</h1>
    <p class="lede">참가자 전체 결과를 확인하려면 관리자 코드를 입력하세요.</p>
    <div class="field-label mono" style="margin-top:10px;">ACCESS CODE</div>
    <input id="adminCodeField" class="field-input mono" type="password" placeholder="코드 입력" value="${escapeAttr(adminCode)}"
      oninput="adminCode=this.value" onkeydown="if(event.key==='Enter')handleAdminLogin()" />
    ${adminError ? `<div class="field-error">${adminError}</div>` : ''}
  `;
}

function handleGuestStart(){
  const val = (guestName || '').trim();
  if(!val){
    entryError = '이름을 입력해주세요.';
    render();
    return;
  }
  guestName = val;
  entryError = '';
  screen = 'quiz';
  qIndex = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  render();
}

async function handleAdminLogin(){
  const code = (adminCode || '').trim();
  if(!code){
    adminError = '코드를 입력해주세요.';
    render();
    return;
  }
  adminLoading = true;
  adminError = '';
  render();
  try{
    const res = await fetch('/api/admin-login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code })
    });
    const data = await res.json().catch(()=>({}));
    adminLoading = false;
    if(!res.ok || !data.ok){
      adminError = '코드가 올바르지 않습니다.';
      render();
      return;
    }
    adminCode = '';
    screen = 'admin';
    render();
    loadAdminResults();
  }catch(e){
    adminLoading = false;
    adminError = '로그인 중 오류가 발생했습니다.';
    render();
  }
}

/* ---------------------------------------------------------
   4. QUIZ
--------------------------------------------------------- */
function renderQuiz(){
  const q = QUESTIONS[qIndex];
  const progress = Math.round(((qIndex)/QUESTIONS.length)*100);
  const selected = answers[qIndex];

  stage.innerHTML = `
    <div class="card">
      <div class="card-topline">
        <span class="tag">✈ BOARDING IN PROGRESS</span>
        <span class="tag">Q${String(qIndex+1).padStart(2,'0')}/${QUESTIONS.length}</span>
      </div>
      <div class="card-inner">
        ${routeIndicator(progress)}
        <div class="scan-top"><span>${progress}% BOARDED</span></div>

        <div class="q-eyebrow mono">QUESTION ${qIndex+1}</div>
        <div class="q-text" style="font-family:'Noto Sans KR',sans-serif;">${q.text}</div>

        <div class="scale-ends"><span>전혀 아니다</span><span>매우 그렇다</span></div>
        <div class="likert">
          ${[1,2,3,4,5].map(v=>`
            <div class="likert-btn ${selected===v?'selected':''}" onclick="selectAnswer(${v})">${v}</div>
          `).join('')}
        </div>
      </div>
      <div class="nav-row">
        <button class="back-link mono" ${qIndex===0?'disabled':''} onclick="goBack()">← 이전 질문</button>
        <span class="skip-hint">${selected? '다음 질문으로 이동' : '문항을 선택해주세요'}</span>
      </div>

}

function selectAnswer(v){
  answers[qIndex]=v;
  render();
  setTimeout(()=>{
    if(qIndex < QUESTIONS.length-1){ qIndex++; render(); }
    else { computeAndShowResult(); }
  }, 260);
}
function goBack(){ if(qIndex>0){ qIndex--; render(); } }

/* ---------------------------------------------------------
   5. SCORING
--------------------------------------------------------- */
function computeAndShowResult(){
  const raw = {};
  AXIS_ORDER.forEach(k=>raw[k]=0);
  QUESTIONS.forEach((q,i)=>{
    const val = answers[i];
    const scored = q.r ? (6-val) : val;
    raw[q.axis]+=scored;
  });
  const pct = {};
  AXIS_ORDER.forEach(k=> pct[k] = Math.round(((raw[k]-5)/20)*100) );

  const sorted = AXIS_ORDER.slice().sort((a,b)=>raw[b]-raw[a]);
  const primary = sorted[0], secondary = sorted[1];
  const isHybrid = (raw[primary]-raw[secondary]) <= 5;

  screen='result';
  render_result_data = { raw, pct, primary, secondary, isHybrid };
  render();
  submitResult(render_result_data);
}

function submitResult(data){
  fetch('/api/submit', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      name: guestName,
      answers: answers,
      scores: { raw: data.raw, pct: data.pct },
      primaryType: data.primary,
      secondaryType: data.secondary,
      isHybrid: data.isHybrid
    })
  }).catch(()=>{ /* 참가자 화면 표시는 이미 끝났으므로 전송 실패는 조용히 무시 */ });
}

/* ---------------------------------------------------------
   6. RADAR
--------------------------------------------------------- */
function polarPoint(cx,cy,r,angleDeg){
  const rad = (angleDeg-90) * Math.PI/180;
  return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
}
const RADAR_SIZE=232, RADAR_CX=RADAR_SIZE/2, RADAR_CY=RADAR_SIZE/2, RADAR_MAXR=84;

function buildRadarSVG(pct, accent){
  const size=RADAR_SIZE, cx=RADAR_CX, cy=RADAR_CY, maxR=RADAR_MAXR;
  const n=AXIS_ORDER.length;
  const rings=[0.25,0.5,0.75,1];

  let gridPaths = rings.map(f=>{
    const pts = AXIS_ORDER.map((k,i)=>polarPoint(cx,cy,maxR*f, i*360/n));
    return `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#D8CFB6" stroke-width="1"/>`;
  }).join('');
  let axisLines = AXIS_ORDER.map((k,i)=>{
    const [x,y] = polarPoint(cx,cy,maxR,i*360/n);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#D8CFB6" stroke-width="1"/>`;
  }).join('');

  const centerPts = AXIS_ORDER.map(()=>`${cx},${cy}`).join(' ');
  let dataPoly = `<polygon id="radarDataPoly" points="${centerPts}" fill="${accent}33" stroke="${accent}" stroke-width="2.5"/>`;
  let dots = AXIS_ORDER.map((k,i)=>`<circle id="radarDot${i}" cx="${cx}" cy="${cy}" r="3.5" fill="#152238"/>`).join('');

  let labels = AXIS_ORDER.map((k,i)=>{
    const [x,y] = polarPoint(cx,cy,maxR+20,i*360/n);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Mono" font-size="10" font-weight="700" fill="#152238">${AXIS_LABEL[k]}</text>`;
  }).join('');

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${gridPaths}${axisLines}${dataPoly}${dots}${labels}</svg>`;
}

function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

function animateRadarGrow(targetPct, duration){
  duration = duration || 900;
  const cx=RADAR_CX, cy=RADAR_CY, maxR=RADAR_MAXR, n=AXIS_ORDER.length;
  const poly = document.getElementById('radarDataPoly');
  if(!poly) return;
  const start = performance.now();

  function frame(now){
    const t = Math.min((now-start)/duration, 1);
    const eased = easeOutCubic(t);
    const pts = AXIS_ORDER.map((k,i)=>{
      const val = Math.max(targetPct[k],4) * eased;
      const r = (val/100)*maxR;
      return polarPoint(cx,cy,r,i*360/n);
    });
    poly.setAttribute('points', pts.map(p=>p.join(',')).join(' '));
    pts.forEach((p,i)=>{
      const dot = document.getElementById('radarDot'+i);
      if(dot){ dot.setAttribute('cx', p[0]); dot.setAttribute('cy', p[1]); }
    });
    if(t<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------
   7. PASSPORT STAMP (signature element)
--------------------------------------------------------- */
function buildStampSVG(sym, accent, name){
  const size=132, cx=size/2, cy=size/2, r=54;
  const label = `THE FARM · ${name} · `;
  const repeated = label.repeat(3);
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-9deg);">
    <defs>
      <path id="stampCircle" d="M ${cx-r},${cy} a ${r},${r} 0 1,1 ${r*2},0 a ${r},${r} 0 1,1 -${r*2},0" />
    </defs>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${accent}" stroke-width="2.5" />
    <circle cx="${cx}" cy="${cy}" r="${r-8}" fill="none" stroke="${accent}" stroke-width="1" stroke-dasharray="2 3" />
    <text font-family="IBM Plex Mono" font-size="8.3" font-weight="700" fill="${accent}" letter-spacing="1">
      <textPath href="#stampCircle" startOffset="0%">${repeated}</textPath>
    </text>
  </svg>`;
}

/* ---------------------------------------------------------
   8. RESULT — BOARDING PASS
--------------------------------------------------------- */
function renderResult(){
  const { pct, primary, secondary, isHybrid } = render_result_data;
  const P = PERSONAS[primary];
  const S = PERSONAS[secondary];
  const flightNo = 'TF' + String(100 + (pct[primary]*3 + pct[secondary]) % 800);
  const gate = String.fromCharCode(65 + AXIS_ORDER.indexOf(primary)) + (10 + (pct[primary]%9));
  const seat = (12 + (pct[secondary]%20)) + ['A','B','C','D'][ (pct[primary]+pct[secondary]) % 4 ];

  stage.innerHTML = `
    <div class="card">
      <div class="card-topline">
        <span class="tag">✈ THE FARM AIR</span>
        <span class="tag">${flightNo}</span>
      </div>
      <div class="card-inner">
        ${routeIndicator(100)}

        <div class="pass-fields">
          <div class="pf"><div class="pf-label">FROM</div><div class="pf-value">${escapeHtml(guestName || 'YOU (SELF)')}</div></div>
          <div class="pf"><div class="pf-label">TO</div><div class="pf-value">THE FARM</div></div>
          <div class="pf"><div class="pf-label">GATE</div><div class="pf-value">${gate}</div></div>
          <div class="pf"><div class="pf-label">SEAT</div><div class="pf-value">${seat}</div></div>
        </div>

        <div class="stamp-wrap">${buildStampSVG(P.sym, P.colorHex, P.name)}</div>

        <div class="type-name-block">
          <div class="type-sub mono">FIELD TYPE · ${P.name}</div>
          <h2 class="type-name display" style="color:${P.colorHex};">${P.name}</h2>
          <div class="type-sub mono" style="letter-spacing:0.06em;">${P.sub}</div>
          <p class="type-tagline">${P.tagline}</p>
          ${isHybrid ? `<div class="hybrid-note mono">${P.name} × ${S.name} 하이브리드 판독</div>` : ''}
        </div>

        <p class="type-desc">${P.desc}</p>

        <div class="radar-wrap">${buildRadarSVG(pct, P.colorHex)}</div>

        <div class="clearance">
          <h3 class="mono">FLIGHT LOG · STATS</h3>
          ${AXIS_ORDER.map(k=>{
            const p = PERSONAS[k];
            const v = Math.max(pct[k],0);
            return `<div class="axis-row">
              <div class="axis-name">${AXIS_LABEL[k]}</div>
              <div class="axis-track"><div class="axis-fill" style="width:${v}%; background:${p.colorHex};"></div></div>
              <div class="axis-score mono">${v}</div>
            </div>`;
          }).join('')}
        </div>

        <div class="traits">
          <h3 class="mono" style="margin-top:0;">${P.name} 특징</h3>
          <ul>${P.traits.map(t=>`<li>${t}</li>`).join('')}</ul>
        </div>
      </div>

      <div class="perf"></div>
      <div class="cta-row">
        <button class="restart" onclick="restart()">다시 탑승하기</button>
        <button class="share" onclick="shareResult()">탑승권 공유하기</button>
      </div>
    </div>
  `;

  requestAnimationFrame(()=> animateRadarGrow(pct, 950));
}

function restart(){
  screen='entry'; entryTab='guest'; qIndex=0; guestName=''; entryError='';
  answers = new Array(QUESTIONS.length).fill(null); render();
}
function shareResult(){
  const { primary } = render_result_data;
  const P = PERSONAS[primary];
  const text = `THE FARM 탑승권 발급 결과: "${P.name}(${P.sub})" 타입이 나왔어요! ✈️`;
  if(navigator.share){
    navigator.share({ title:'THE FARM 탑승권', text }).catch(()=>{});
  } else {
    navigator.clipboard?.writeText(text);
    alert('결과 문구가 복사되었어요. 원하는 곳에 붙여넣어 공유해보세요!');
  }
}

/* ---------------------------------------------------------
   9. ADMIN DASHBOARD
--------------------------------------------------------- */
function renderAdminDashboard(){
  stage.innerHTML = `
    <div class="admin-shell">
      <div class="admin-header">
        <div>
          <div class="admin-title display">THE FARM 관리자 대시보드</div>
          <div class="admin-sub mono">전체 응시자 결과</div>
        </div>
        <div class="admin-actions">
          <button class="admin-btn ghost" onclick="exportCSV()" ${(!adminResults || !adminResults.length)?'disabled':''}>CSV 내보내기</button>
          <button class="admin-btn" onclick="handleAdminLogout()">로그아웃</button>
        </div>
      </div>
      <div id="adminBody">${adminResultsBodyHTML()}</div>
    </div>
  `;
}

function adminResultsBodyHTML(){
  if(adminResultsError){
    return `<div class="admin-empty">${escapeHtml(adminResultsError)}</div>`;
  }
  if(!adminResults){
    return `<div class="admin-empty">불러오는 중...</div>`;
  }
  if(adminResults.length===0){
    return `<div class="admin-empty">아직 제출된 응답이 없습니다.</div>`;
  }
  return `
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr>
          <th>이름</th><th>주유형</th><th>부유형</th><th>하이브리드</th>
          ${AXIS_ORDER.map(k=>`<th>${AXIS_LABEL[k]}</th>`).join('')}
          <th>완료시각</th>
        </tr></thead>
        <tbody>
          ${adminResults.map(r=>{
            const s = (r.scores && r.scores.pct) ? r.scores.pct : {};
            const primaryP = PERSONAS[r.primary_type];
            const secondaryP = PERSONAS[r.secondary_type];
            return `<tr>
              <td>${escapeHtml(r.name)}</td>
              <td>${escapeHtml(primaryP ? primaryP.name : r.primary_type)}</td>
              <td>${escapeHtml(secondaryP ? secondaryP.name : r.secondary_type)}</td>
              <td>${r.is_hybrid ? 'Y' : '-'}</td>
              ${AXIS_ORDER.map(k=>`<td>${s[k] ?? '-'}</td>`).join('')}
              <td class="mono">${formatDate(r.submitted_at)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function loadAdminResults(){
  adminResults = null;
  adminResultsError = '';
  refreshAdminBody();
  try{
    const res = await fetch('/api/admin-results');
    if(res.status===401){
      screen='entry'; entryTab='admin'; adminError='세션이 만료되었습니다. 다시 로그인해주세요.';
      render();
      return;
    }
    const data = await res.json();
    if(!res.ok || !data.ok) throw new Error(data.error || '조회 실패');
    adminResults = data.results;
  }catch(e){
    adminResultsError = '결과를 불러오지 못했습니다. 새로고침해보세요.';
  }
  refreshAdminBody();
}

function refreshAdminBody(){
  const body = document.getElementById('adminBody');
  if(body) body.innerHTML = adminResultsBodyHTML();
  const exportBtn = document.querySelector('.admin-btn.ghost');
  if(exportBtn) exportBtn.disabled = !(adminResults && adminResults.length);
}

function handleAdminLogout(){
  fetch('/api/admin-logout', { method:'POST' }).finally(()=>{
    adminResults = null;
    adminResultsError = '';
    adminCode = '';
    entryTab = 'guest';
    screen = 'entry';
    render();
  });
}

function formatDate(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function exportCSV(){
  if(!adminResults || !adminResults.length) return;
  const headers = ['이름','주유형','부유형','하이브리드', ...AXIS_ORDER.map(k=>AXIS_LABEL[k]), '완료시각'];
  const rows = adminResults.map(r=>{
    const s = (r.scores && r.scores.pct) ? r.scores.pct : {};
    const primaryP = PERSONAS[r.primary_type];
    const secondaryP = PERSONAS[r.secondary_type];
    return [
      r.name,
      primaryP ? primaryP.name : r.primary_type,
      secondaryP ? secondaryP.name : r.secondary_type,
      r.is_hybrid ? 'Y' : '-',
      ...AXIS_ORDER.map(k => s[k] ?? ''),
      formatDate(r.submitted_at)
    ];
  });
  const csvLines = [headers, ...rows].map(row =>
    row.map(cell => {
      const str = String(cell ?? '');
      return /[",\n]/.test(str) ? '"' + str.replace(/"/g,'""') + '"' : str;
    }).join(',')
  );
  const csvContent = '﻿' + csvLines.join('\r\n');
  const blob = new Blob([csvContent], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `the_farm_results_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
</script>
