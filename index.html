<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE FARM — PERSONA SCAN</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#0B0906;
    --card:#17140F;
    --ink:#F2ECDD;
    --ink-soft:#A99B7E;
    --line:#332B1D;
    --accent:#E3A83D;
    --accent-soft:#3A2E14;
    --on-accent:#171208;
    --operator:#E2604A;
    --explorer:#3FA6C4;
    --thinker:#9B6FE0;
    --builder:#4CBE84;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:26px 14px;
  }
  .stage{ width:100%; max-width:460px; transition:max-width 0.15s ease; }
  .stage.wide{ max-width:980px; }
  .display{ font-family:'Pretendard', sans-serif; font-weight:800; letter-spacing:-0.02em; }
  .mono{ font-family:'Pretendard', sans-serif; font-variant-numeric:tabular-nums; }

  /* ---------- ticket shell ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:0 24px 60px rgba(0,0,0,0.55), 0 0 40px rgba(227,168,61,0.05), 0 0 0 1px rgba(227,168,61,0.05);
    position:relative;
    overflow:visible;
  }
  .card-topline{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 20px;
    background:#100D08;
    color:var(--accent);
    border-bottom:1px solid var(--line);
    border-radius:19px 19px 0 0;
  }
  .card-topline .tag{ font-family:'Pretendard',sans-serif; font-size:10px; letter-spacing:0.14em; display:flex; align-items:center; gap:6px; }

  .card-inner{ padding:26px 24px 8px; }

  /* ---------- progress bar (quiz) ---------- */
  .progress-bar{ position:relative; height:5px; background:var(--line); border-radius:100px; margin:4px 0 4px; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:100px; transition:width 0.3s ease; }
  .progress-mask{
    position:absolute; top:50%; transform:translate(-50%,-50%); font-size:17px;
    transition:left 0.3s ease; filter:drop-shadow(0 1px 3px rgba(0,0,0,0.5));
  }

  /* ---------- section divider ---------- */
  .divider{ height:0; border-top:1px solid var(--line); margin:22px 0 0; }

  /* ---------- entry tabs ---------- */
  .entry-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .entry-tab{
    flex:1; padding:11px; border-radius:9px; border:1.5px solid var(--line);
    background:var(--card); font-family:'Pretendard',sans-serif; font-size:12.5px; font-weight:700;
    letter-spacing:0.04em; color:var(--ink-soft); cursor:pointer; transition:all 0.14s ease;
  }
  .entry-tab:hover{ border-color:var(--accent); color:var(--accent); }
  .entry-tab.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

  .field-label{ font-family:'Pretendard',sans-serif; font-size:11px; color:var(--ink-soft); letter-spacing:0.08em; margin:4px 0 7px; }
  .field-input{
    width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-size:15.5px; font-family:'Pretendard',sans-serif; color:var(--ink); background:#1D1911; margin-bottom:4px;
    transition:border-color 0.14s ease, box-shadow 0.14s ease;
  }
  .field-input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .field-error{ font-family:'Pretendard',sans-serif; font-size:11.5px; color:var(--operator); margin:6px 0 0; }

  /* ---------- intro ---------- */
  .lede{ font-size:14.5px; color:var(--ink-soft); line-height:1.7; margin:12px 0 22px; }
  h1.title{ font-size:28px; line-height:1.35; margin:10px 0 0; }
  .type-preview{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin:22px 0 6px; }
  .type-chip{ border:1.5px solid var(--line); border-radius:10px; padding:10px 3px 8px; text-align:center; background:#1D1911; }
  .chip-avatar{ width:36px; height:36px; border-radius:50%; overflow:hidden; margin:0 auto 6px; }
  .chip-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .type-chip .code{ font-family:'Pretendard',sans-serif; font-size:9px; color:var(--ink-soft); }

  .stub{ padding:16px 24px 24px; }
  button.primary{
    width:100%; background:var(--accent); color:var(--on-accent); border:none; border-radius:14px;
    padding:16px; font-family:'Pretendard',sans-serif; font-weight:700; font-size:15px;
    letter-spacing:-0.01em; cursor:pointer; transition:transform 0.12s ease, opacity 0.12s ease;
  }
  button.primary:hover{ opacity:0.9; transform:translateY(-1px); }
  button.primary:disabled{ opacity:0.55; cursor:default; transform:none; }
  .meta-line{ text-align:center; font-family:'Pretendard',sans-serif; font-size:10.5px; color:var(--ink-soft); margin-top:12px; }

  /* ---------- quiz ---------- */
  .scan-top{ display:flex; justify-content:space-between; font-family:'Pretendard',sans-serif; font-size:10px; color:var(--ink-soft); margin:12px 0 2px; }
  .q-eyebrow{ font-family:'Pretendard',sans-serif; font-size:11px; color:var(--ink-soft); margin:22px 0 8px; }
  .q-text{ font-size:19px; line-height:1.55; font-weight:700; margin-bottom:24px; min-height:78px; }

  .scale-ends{ display:flex; justify-content:space-between; font-family:'Pretendard',sans-serif; font-size:10px; color:var(--ink-soft); margin-bottom:8px; }
  .likert{ display:flex; gap:8px; margin-bottom:16px; }
  .likert-btn{
    flex:1; height:50px; display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--line); border-radius:9px; font-family:'Pretendard',sans-serif;
    font-size:15px; font-weight:600; color:var(--ink-soft); background:#1D1911; cursor:pointer;
    transition:all 0.14s ease;
  }
  .likert-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .likert-btn.selected{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; padding:0 24px 22px; }
  .back-link{ font-family:'Pretendard',sans-serif; font-size:11.5px; color:var(--ink-soft); background:none; border:none; cursor:pointer; padding:8px 2px; }
  .back-link:disabled{ opacity:0; pointer-events:none; }
  .skip-hint{ font-family:'Pretendard',sans-serif; font-size:10.5px; color:var(--ink-soft); }

  /* ---------- result: PERSONA CARD ---------- */
  .id-row{ display:flex; gap:24px; margin:4px 0 6px; }
  .id-field{ }
  .id-label{ font-family:'Pretendard',sans-serif; font-size:9.5px; color:var(--ink-soft); letter-spacing:0.1em; margin-bottom:3px; }
  .id-value{ font-family:'Pretendard',sans-serif; font-size:13.5px; font-weight:700; }

  .badge-wrap{ display:flex; justify-content:center; margin:18px 0 8px; }
  .persona-badge{
    width:152px; height:152px; border-radius:50%; overflow:hidden;
  }
  .persona-badge img{ width:100%; height:100%; object-fit:cover; display:block; }
  .type-name-block{ text-align:center; margin:6px 0 4px; }
  h2.type-name{ font-size:33px; margin:2px 0 6px; }
  .type-sub{ font-family:'Pretendard',sans-serif; font-size:11px; letter-spacing:0.14em; color:var(--ink-soft); }
  .type-tagline{ font-size:14px; color:var(--ink-soft); line-height:1.6; text-align:center; margin:8px 0 0; }
  .type-summary{ font-size:14px; color:var(--ink); line-height:1.65; text-align:center; margin:10px 0 0; }
  .tag-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin:12px 0 0; }
  .persona-tag{ font-family:'Pretendard',sans-serif; font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:100px; }
  .hybrid-note{
    display:block; width:fit-content; margin:12px auto 0; font-family:'Pretendard',sans-serif; font-size:10.5px;
    border:1px dashed var(--line); border-radius:100px; padding:5px 11px;
  }
  .radar-wrap{ display:flex; justify-content:center; padding:10px 0 4px; }

  .clearance h3{ font-family:'Pretendard',sans-serif; font-size:10.5px; letter-spacing:0.1em; color:var(--ink-soft); margin:16px 0 10px; }
  .axis-row{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
  .axis-name{ width:74px; flex-shrink:0; font-size:11.5px; font-weight:700; }
  .axis-track{ flex:1; height:8px; background:var(--paper); border:1px solid var(--line); border-radius:100px; overflow:hidden; }
  .axis-fill{ height:100%; border-radius:100px; }
  .axis-score{ width:30px; text-align:right; font-family:'Pretendard',sans-serif; font-size:10.5px; color:var(--ink-soft); flex-shrink:0; }

  .cta-row{ display:flex; flex-wrap:wrap; gap:9px; padding:20px 24px 24px; }
  .cta-row button{
    flex:1; min-width:120px; border-radius:13px; padding:13px; font-family:'Pretendard',sans-serif;
    font-weight:700; font-size:12.5px; letter-spacing:-0.01em; cursor:pointer; border:1.5px solid var(--line);
  }
  .cta-row button:disabled{ opacity:0.55; cursor:default; }
  .cta-row .full{ flex-basis:100%; }
  .cta-row .restart{ background:var(--card); color:var(--ink); }
  .cta-row .share{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .cta-row .share-outline{ background:var(--card); border-color:var(--accent); color:var(--accent); }

  /* ---------- admin dashboard ---------- */
  .admin-shell{ background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(227,168,61,0.05); padding:22px 22px 26px; }
  .admin-header{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .admin-title{ font-size:21px; }
  .admin-sub{ font-size:11px; color:var(--ink-soft); letter-spacing:0.1em; margin-top:5px; }
  .admin-actions{ display:flex; gap:8px; }
  .admin-btn{
    font-family:'Pretendard',sans-serif; font-size:12px; font-weight:700; padding:10px 14px;
    border-radius:10px; border:1.5px solid var(--accent); background:var(--accent); color:var(--on-accent); cursor:pointer;
  }
  .admin-btn.ghost{ background:var(--card); color:var(--accent); }
  .admin-btn:disabled{ opacity:0.5; cursor:default; }
  .admin-row-btn{
    font-family:'Pretendard',sans-serif; font-size:11px; font-weight:700; padding:6px 10px;
    border-radius:7px; border:1.5px solid var(--line); background:#1D1911; color:var(--ink); cursor:pointer; white-space:nowrap;
  }
  .admin-row-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .admin-row-btn:disabled{ opacity:0.5; cursor:default; }
  .admin-empty{ padding:44px 0; text-align:center; color:var(--ink-soft); font-family:'Pretendard',sans-serif; font-size:12.5px; }
  .admin-table-wrap{ overflow-x:auto; }
  .admin-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .admin-table th{
    text-align:left; font-family:'Pretendard',sans-serif; font-size:10.5px; letter-spacing:0.05em;
    color:var(--ink-soft); padding:9px 12px; border-bottom:1.5px solid var(--line); white-space:nowrap;
  }
  .admin-table td{ padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; font-size:13px; }
  .admin-table tbody tr:hover{ background:var(--paper); }

  @media (max-width:420px){
    .card-inner{ padding:22px 18px 8px; }
    .stub, .nav-row, .cta-row{ padding-left:18px; padding-right:18px; }
    h1.title{ font-size:23px; }
    .q-text{ font-size:17px; min-height:88px; }
    h2.type-name{ font-size:27px; }
    .admin-shell{ padding:18px 16px 20px; }
  }
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<script>
/* ---------------------------------------------------------
   1. DATA
--------------------------------------------------------- */
const PERSONAS = {
  explorer: {
    key:'explorer', code:'GE', name:'GLOBAL EXPLORER', sub:'적응형', tagEn:'GLOBAL ADAPTER', sym:'🧭', colorHex:'#3FA6C4',
    tagline:'낯선 환경에서도 빠르게 상황을 파악하고 관계를 만들어가는 타입.',
    desc:'새로운 장소와 사람, 익숙하지 않은 업무 환경에서도 비교적 빠르게 적응합니다. 해외 출장이나 처음 만나는 파트너와의 미팅처럼 변수가 많은 상황에서도 위축되기보다 상황을 파악하고 필요한 소통을 시작하는 편입니다. 완벽하게 익숙하지 않은 환경에서도 먼저 경험하며 배우기 때문에 해외 프로젝트, 현지 커뮤니케이션, 새로운 관계 형성이 필요한 업무에서 강점을 보입니다.',
    summary:'새로운 환경과 사람 앞에서도 위축되지 않고 먼저 상황을 파악합니다. 해외 프로젝트나 낯선 파트너와의 협업에서 강점을 보이는 타입입니다.',
    traits:['낯선 환경에 대한 적응력','새로운 사람과의 초기 커뮤니케이션','익숙하지 않은 상황에서도 움직이는 개방성'],
    tags:['해외적응력','커뮤니케이션','오픈마인드']
  },
  builder: {
    key:'builder', code:'BD', name:'BUILDER', sub:'구축형', tagEn:'TOOL BUILDER', sym:'🛠️', colorHex:'#4CBE84',
    tagline:'흩어진 정보를 정리하고, 적합한 도구를 활용해 결과물로 만드는 타입.',
    desc:'복잡한 정보가 주어져도 핵심을 빠르게 정리하고 필요한 형태의 결과물로 만드는 데 강점이 있습니다. PPT, AI, 협업툴 등 새로운 도구도 필요하다면 빠르게 익혀 업무에 적용합니다. 단순히 툴을 많이 사용하는 사람이 아니라 정보를 찾고, 구조화하고, 실제 결과물로 완성하는 과정에 강한 유형입니다.',
    summary:'복잡한 정보도 핵심만 빠르게 정리해 결과물로 만들어냅니다. PPT, AI, 협업툴 등 새로운 도구를 익혀 실무에 바로 적용하는 타입입니다.',
    traits:['정보 탐색 및 구조화 능력','새로운 도구의 빠른 습득·활용','자료를 실제 결과물로 완성하는 능력'],
    tags:['자료제작','툴활용','구조화']
  },
  operator: {
    key:'operator', code:'OP', name:'OPERATOR', sub:'실행형', tagEn:'FAST MOVER', sym:'⚡', colorHex:'#E2604A',
    tagline:'해야 할 일이 보이면 판단하고 바로 실행으로 옮기는 타입.',
    desc:'업무의 모든 조건이 완벽하게 정리될 때까지 기다리기보다, 현재 주어진 정보를 바탕으로 우선 필요한 행동을 시작합니다. 특히 행사 현장처럼 예상하지 못한 변수가 생기거나 역할이 명확하지 않은 순간에도 상황을 파악하고 먼저 움직입니다. 현장 운영, 즉각적인 대응, 빠른 실행이 필요한 업무에서 강점을 보입니다.',
    summary:'모든 게 정리되기를 기다리기보다 지금 할 수 있는 행동부터 시작합니다. 예상 밖의 변수가 생기는 현장에서도 먼저 움직이는 타입입니다.',
    traits:['실행 전환 속도','모호한 상황에서의 주도성','현장 변수에 대한 즉각적인 대응력'],
    tags:['주도성','즉각실행','현장대응']
  },
  thinker: {
    key:'thinker', code:'CT', name:'CREATIVE THINKER', sub:'발상형', tagEn:'IDEA GENERATOR', sym:'💡', colorHex:'#9B6FE0',
    tagline:'주어진 답을 따르기보다 문제를 다시 보고 더 나은 방법을 찾는 타입.',
    desc:'기존 방식이 있더라도 그것이 최선인지 한 번 더 고민합니다. 문제가 생겼을 때 단순히 주어진 선택지 중 하나를 고르기보다 다른 접근법이나 새로운 대안을 만들어내는 편입니다. 아이디어 자체뿐 아니라 문제를 다른 관점에서 바라보고 해결 방향을 제안하는 능력이 강한 유형입니다.',
    summary:'기존 방식이 있어도 더 나은 방법이 없을지 한 번 더 고민합니다. 문제를 다른 관점에서 바라보고 새로운 대안을 제안하는 타입입니다.',
    traits:['다양한 대안 발상','기존 방식에 대한 개선 사고','문제를 새롭게 바라보는 관점'],
    tags:['아이디어','개선사고','새로운관점']
  }
};

const AXIS_ORDER = ['explorer','builder','operator','thinker'];
const AXIS_LABEL = { explorer:'글로벌 적응력', builder:'구조화력', operator:'실행력', thinker:'문제해결 발상력' };

const QUESTIONS = [
  { id:1,  axis:'explorer', r:false, text:'처음 가는 장소나 익숙하지 않은 환경에서 적응이 빠른 편이다.' },
  { id:2,  axis:'builder',  r:false, text:'정보가 여러 곳에 흩어져 있을 때 핵심 내용을 정리해 정보를 요약하는데 익숙하다.' },
  { id:3,  axis:'operator', r:false, text:'업무 중 예상하지 못한 문제가 생기면 우선 지금 당장 할 수 있는 조치부터 찾는 편이다.' },
  { id:4,  axis:'thinker',  r:false, text:'기존 방식으로 문제가 잘 해결되지 않으면 다른 접근 방법을 몇 가지 떠올려 비교해보는 편이다.' },

  { id:5,  axis:'explorer', r:true,  text:'처음 만나는 사람들과 어울려야 할 때 상대가 먼저 말을 걸어줄 때까지 기다리는 편이다.' },
  { id:6,  axis:'builder',  r:true,  text:'익숙하지 않은 도구를 사용해야 한다면 새로운 방법을 익히기보다 기존 방식으로 해결하려는 편이다.' },

}

  if(!/^\d{4}$/.test(phone)){

  }
  guestName = name;

  entryLoading = true;

  try{
    const res = await fetch(`/api/lookup-result?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`);
    const data = await res.json().catch(()=>({}));
    if(res.ok && data.ok && data.result){
      entryLoading = false;
      const r = data.result;
      render_result_data = {

  try{
    const res = await fetch('/api/admin-login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code })
    });
    const data = await res.json().catch(()=>({}));
    adminLoading = false;
    if(!res.ok || !data.ok){

    adminCode = '';
    screen = 'admin';

    render();

--------------------------------------------------------- */
function computeAndShowResult(){
  const raw = {};
  AXIS_ORDER.forEach(k=>raw[k]=0);
  QUESTIONS.forEach((q,i)=>{
    const val = answers[i];
    const scored = q.r ? (6-val) : val;
    raw[q.axis]+=scored;
  });
  const pct = {};
  AXIS_ORDER.forEach(k=> pct[k] = Math.round(((raw[k]-4)/16)*100) );

  const sorted = AXIS_ORDER.slice().sort((a,b)=>raw[b]-raw[a]);
  const primary = sorted[0], secondary = sorted[1];
  const isHybrid = (raw[primary]-raw[secondary]) <= 4;

  screen='result';
  render_result_data = { raw, pct, primary, secondary, isHybrid };
  render();
  submitResult(render_result_data);
}

function submitResult(data){
  fetch('/api/submit', {

    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      name: guestName,
      phoneLast4: guestPhone,
      answers: answers,
      scores: { raw: data.raw, pct: data.pct },
      primaryType: data.primary,
      secondaryType: data.secondary,
      isHybrid: data.isHybrid
    })
  }).catch(()=>{ /* 참가자 화면 표시는 이미 끝났으므로 전송 실패는 조용히 무시 */ });
}

/* ---------------------------------------------------------
   6. RADAR
--------------------------------------------------------- */
function polarPoint(cx,cy,r,angleDeg){
  const rad = (angleDeg-90) * Math.PI/180;
  return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
}
const RADAR_SIZE=280, RADAR_CX=RADAR_SIZE/2, RADAR_CY=RADAR_SIZE/2, RADAR_MAXR=84;

function buildRadarSVG(pct, accent){
  const size=RADAR_SIZE, cx=RADAR_CX, cy=RADAR_CY, maxR=RADAR_MAXR;
  const n=AXIS_ORDER.length;
  const rings=[0.25,0.5,0.75,1];

  let gridPaths = rings.map(f=>{
    const pts = AXIS_ORDER.map((k,i)=>polarPoint(cx,cy,maxR*f, i*360/n));
    return `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#453A26" stroke-width="1"/>`;
  }).join('');
  let axisLines = AXIS_ORDER.map((k,i)=>{
    const [x,y] = polarPoint(cx,cy,maxR,i*360/n);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#453A26" stroke-width="1"/>`;
  }).join('');

  const centerPts = AXIS_ORDER.map(()=>`${cx},${cy}`).join(' ');
  let dataPoly = `<polygon id="radarDataPoly" points="${centerPts}" fill="${accent}33" stroke="${accent}" stroke-width="2.5"/>`;
  let dots = AXIS_ORDER.map((k,i)=>`<circle id="radarDot${i}" cx="${cx}" cy="${cy}" r="3.5" fill="#F2ECDD"/>`).join('');

  let labels = AXIS_ORDER.map((k,i)=>{
    const [x,y] = polarPoint(cx,cy,maxR+20,i*360/n);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="Pretendard" font-size="9" font-weight="700" fill="#F2ECDD">${AXIS_LABEL[k]}</text>`;
  }).join('');

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${gridPaths}${axisLines}${dataPoly}${dots}${labels}</svg>`;
}

function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

function animateRadarGrow(targetPct, duration){
  duration = duration || 900;
  const cx=RADAR_CX, cy=RADAR_CY, maxR=RADAR_MAXR, n=AXIS_ORDER.length;
  const poly = document.getElementById('radarDataPoly');
  if(!poly) return;
  const start = performance.now();

  function frame(now){
    const t = Math.min((now-start)/duration, 1);
    const eased = easeOutCubic(t);
    const pts = AXIS_ORDER.map((k,i)=>{
      const val = Math.max(targetPct[k],4) * eased;
      const r = (val/100)*maxR;
      return polarPoint(cx,cy,r,i*360/n);
    });
    poly.setAttribute('points', pts.map(p=>p.join(',')).join(' '));
    pts.forEach((p,i)=>{
      const dot = document.getElementById('radarDot'+i);
      if(dot){ dot.setAttribute('cx', p[0]); dot.setAttribute('cy', p[1]); }
    });
    if(t<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function restart(){
  screen='entry'; entryTab='guest'; qIndex=0; guestName=''; guestPhone=''; entryError='';
  answers = new Array(QUESTIONS.length).fill(null); render();
}

function waitForImages(container){
  const imgs = [...container.querySelectorAll('img')];
  return Promise.all(imgs.map(img => {
    if(img.complete) return Promise.resolve();
    return new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
  }));
}

async function captureResultCanvas(){
  const card = document.querySelector('.card');
  if(!card || !window.html2canvas) return null;
  const ctaRow = card.querySelector('.cta-row');
  const prevDisplay = ctaRow ? ctaRow.style.display : '';
  if(ctaRow) ctaRow.style.display = 'none';
  try{
    await waitForImages(card);
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    return await window.html2canvas(card, { backgroundColor:'#17140F', scale:2, useCORS:true });
  } finally {
    if(ctaRow) ctaRow.style.display = prevDisplay;
  }
}

function resultFileBase(){
  const primary = render_result_data ? render_result_data.primary : 'result';
  const nameForFile = (guestName || 'guest').replace(/[^\w가-힣]/g, '');
  return `THE_FARM_${primary}_${nameForFile}`;
}

async function saveAsImage(){
  const btn = document.getElementById('saveImageBtn');
  if(btn) btn.disabled = true;
  try{
    const canvas = await captureResultCanvas();
    if(!canvas){ alert('이미지 저장 기능을 불러오지 못했어요. 새로고침 후 다시 시도해주세요.'); return; }
    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = `${resultFileBase()}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  } finally {
    if(btn) btn.disabled = false;
  }
}

async function saveAsPDF(){
  const btn = document.getElementById('savePdfBtn');
  if(btn) btn.disabled = true;
  try{
    const card = document.querySelector('.card');
    if(!card || !window.jspdf){ alert('PDF 저장 기능을 불러오지 못했어요. 새로고침 후 다시 시도해주세요.'); return; }
    const rect = card.getBoundingClientRect();
    const canvas = await captureResultCanvas();
    if(!canvas) return;
    const pxToMm = 0.264583;
    const wMm = rect.width * pxToMm;
    const hMm = rect.height * pxToMm;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: wMm > hMm ? 'landscape' : 'portrait', unit:'mm', format:[wMm, hMm] });
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, wMm, hMm);
    pdf.save(`${resultFileBase()}.pdf`);
  } finally {
    if(btn) btn.disabled = false;
  }
}

async function downloadRowImage(i, btn){
  const r = adminResults && adminResults[i];
  if(!r || !window.html2canvas) return;

  const prevText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '저장 중...'; }

  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'position:fixed; left:-9999px; top:0; width:460px;';
  document.body.appendChild(wrapper);

  try{
    const pct = (r.scores && r.scores.pct) || {};
    const primary = r.primary_type, secondary = r.secondary_type;
    wrapper.innerHTML = resultCardHTML(r.name, pct, primary, secondary, !!r.is_hybrid);
    animateRadarGrow(pct, 1);
    await waitForImages(wrapper);
    await new Promise(resolve => setTimeout(resolve, 80));
    if(document.fonts && document.fonts.ready) await document.fonts.ready;

    const cardEl = wrapper.querySelector('.card');
    const canvas = await window.html2canvas(cardEl, { backgroundColor:'#17140F', scale:2, useCORS:true });
    const nameForFile = (r.name || 'guest').replace(/[^\w가-힣]/g, '');
    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = `THE_FARM_${primary}_${nameForFile}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }catch(e){
    alert('이미지 저장에 실패했어요. 다시 시도해주세요.');
  } finally {
    document.body.removeChild(wrapper);
    if(btn){ btn.disabled = false; btn.textContent = prevText; }
  }
}

/* ---------------------------------------------------------
   9. ADMIN DASHBOARD
--------------------------------------------------------- */
function renderAdminDashboard(){
  stage.innerHTML = `
    <div class="admin-shell">
      <div class="admin-header">
        <div>
          <div class="admin-title display">THE FARM 관리자 대시보드</div>
          <div class="admin-sub mono">전체 응시자 결과</div>
        </div>
        <div class="admin-actions">
          <button class="admin-btn ghost" onclick="exportCSV()" ${(!adminResults || !adminResults.length)?'disabled':''}>CSV 내보내기</button>
          <button class="admin-btn" onclick="handleAdminLogout()">로그아웃</button>
        </div>
      </div>
      <div id="adminBody">${adminResultsBodyHTML()}</div>
    </div>
  `;
}

function adminResultsBodyHTML(){
  if(adminResultsError){
    return `<div class="admin-empty">${escapeHtml(adminResultsError)}</div>`;
  }
  if(!adminResults){
    return `<div class="admin-empty">불러오는 중...</div>`;
  }
  if(adminResults.length===0){
    return `<div class="admin-empty">아직 제출된 응답이 없습니다.</div>`;
  }
  return `
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr>
          <th>이름</th><th>주유형</th><th>부유형</th><th>하이브리드</th>
          ${AXIS_ORDER.map(k=>`<th>${AXIS_LABEL[k]}</th>`).join('')}
          <th>완료시각</th><th>다운로드</th>
        </tr></thead>
        <tbody>
          ${adminResults.map((r,i)=>{
            const s = (r.scores && r.scores.pct) ? r.scores.pct : {};
            const primaryP = PERSONAS[r.primary_type];
            const secondaryP = PERSONAS[r.secondary_type];
            return `<tr>
              <td>${escapeHtml(r.name)}</td>
              <td>${escapeHtml(primaryP ? primaryP.name : r.primary_type)}</td>
              <td>${escapeHtml(secondaryP ? secondaryP.name : r.secondary_type)}</td>
              <td>${r.is_hybrid ? 'Y' : '-'}</td>
              ${AXIS_ORDER.map(k=>`<td>${s[k] ?? '-'}</td>`).join('')}
              <td class="mono">${formatDate(r.submitted_at)}</td>
              <td><button class="admin-row-btn" onclick="downloadRowImage(${i}, this)">이미지 저장</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

async function loadAdminResults(){
  adminResults = null;
  adminResultsError = '';
  refreshAdminBody();
  try{
    const res = await fetch('/api/admin-results');
    if(res.status===401){
      screen='entry'; entryTab='admin'; adminError='세션이 만료되었습니다. 다시 로그인해주세요.';
      render();
      return;
    }
    const data = await res.json();
    if(!res.ok || !data.ok) throw new Error(data.error || '조회 실패');
    adminResults = data.results;
  }catch(e){
    adminResultsError = '결과를 불러오지 못했습니다. 새로고침해보세요.';
  }
  refreshAdminBody();
}

function refreshAdminBody(){
  const body = document.getElementById('adminBody');
  if(body) body.innerHTML = adminResultsBodyHTML();
  const exportBtn = document.querySelector('.admin-btn.ghost');
  if(exportBtn) exportBtn.disabled = !(adminResults && adminResults.length);
}

function handleAdminLogout(){
  fetch('/api/admin-logout', { method:'POST' }).finally(()=>{
    adminResults = null;
    adminResultsError = '';
    adminCode = '';
    entryTab = 'guest';
    screen = 'entry';
    render();
  });
}

function formatDate(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function exportCSV(){
  if(!adminResults || !adminResults.length) return;
  const headers = ['이름','주유형','부유형','하이브리드', ...AXIS_ORDER.map(k=>AXIS_LABEL[k]), '완료시각'];
  const rows = adminResults.map(r=>{
    const s = (r.scores && r.scores.pct) ? r.scores.pct : {};
    const primaryP = PERSONAS[r.primary_type];
    const secondaryP = PERSONAS[r.secondary_type];
    return [
      r.name,
      primaryP ? primaryP.name : r.primary_type,
      secondaryP ? secondaryP.name : r.secondary_type,
      r.is_hybrid ? 'Y' : '-',
      ...AXIS_ORDER.map(k => s[k] ?? ''),
      formatDate(r.submitted_at)
    ];
  });
  const csvLines = [headers, ...rows].map(row =>
    row.map(cell => {
      const str = String(cell ?? '');
      return /[",\n]/.test(str) ? '"' + str.replace(/"/g,'""') + '"' : str;
    }).join(',')
  );
  const csvContent = '﻿' + csvLines.join('\r\n');
  const blob = new Blob([csvContent], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `the_farm_results_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
</script>
